services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /var/lib/bai-nha
      SECURE_COOKIE: "1"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    volumes:
      - appdata:/var/lib/bai-nha
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  appdata:
  caddy_data:
  caddy_config:
